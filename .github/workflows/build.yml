name: Build Domain Admin Console

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\DomainAdminConsole.csproj

      - name: Build
        run: dotnet build .\DomainAdminConsole.csproj -c Release --no-restore

      - name: Publish win-x64
        run: >-
          dotnet publish .\DomainAdminConsole.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o .\publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DomainAdminConsole-win-x64
          path: .\publish\
