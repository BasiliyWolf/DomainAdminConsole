name: Build Domain Admin Console

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\DomainAdminConsole.csproj

      - name: Build
        run: dotnet build .\DomainAdminConsole.csproj -c Release --no-restore

      - name: Publish win-x64
        run: >-
          dotnet publish .\DomainAdminConsole.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o .\publish

      - name: Create update ZIP
        shell: pwsh
        run: |
          if (Test-Path .\DomainAdminConsole-win-x64.zip) {
            Remove-Item .\DomainAdminConsole-win-x64.zip -Force
          }
          Compress-Archive -Path .\publish\* -DestinationPath .\DomainAdminConsole-win-x64.zip -CompressionLevel Optimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DomainAdminConsole-win-x64
          path: .\DomainAdminConsole-win-x64.zip

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag .\DomainAdminConsole-win-x64.zip --clobber
          } else {
            gh release create $tag .\DomainAdminConsole-win-x64.zip --title "Domain Admin Console $tag" --generate-notes
          }
